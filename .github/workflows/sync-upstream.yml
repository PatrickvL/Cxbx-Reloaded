name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/PatrickvL/Cxbx-Reloaded.git

      - name: Fetch upstream dx11 branch
        run: git fetch upstream dx11

      - name: Merge upstream dx11 into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/dx11 --ff-only

      - name: Push
        run: git push origin master
